<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeemEditor — WYSIWYG demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Vazirmatn, system-ui, sans-serif;
        background:
          radial-gradient(circle at 10% 10%, #ccfbf1 0, transparent 40%),
          radial-gradient(circle at 90% 0%, #e0f2fe 0, transparent 35%),
          #f8fafc;
        color: #0f172a;
      }
      .page {
        max-width: 880px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .lead {
        margin: 0 0 16px;
        color: #475569;
        line-height: 1.8;
      }
      .lang {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        color: #334155;
      }
      .lang select {
        height: 34px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0 10px;
        font: inherit;
        background: #fff;
      }
      .preview {
        margin-top: 24px;
        padding: 16px;
        border-radius: 12px;
        background: #fff;
        border: 1px dashed #cbd5e1;
      }
      .preview h2 {
        margin: 0 0 12px;
        font-size: 15px;
        color: #64748b;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        direction: ltr;
        text-align: left;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
